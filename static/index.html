<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyMate Agent</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 0 auto; padding: 16px; }
    #chat { border: 1px solid #ccc; border-radius: 8px; height: 60vh; overflow-y: auto; padding: 12px; }
    .msg { margin: 8px 0; padding: 8px 12px; border-radius: 8px; white-space: pre-wrap; }
    .user { background: #dbeafe; text-align: right; }
    .bot { background: #f1f5f9; }
    #row { display: flex; gap: 8px; margin-top: 12px; }
    #input { flex: 1; padding: 10px; }
    button { padding: 10px 16px; }
  </style>
</head>
<body>
  <h2>📚 StudyMate Agent</h2>
  <div id="chat"></div>
  <div id="row">
    <input id="input" placeholder="Ask me anything..." />
    <button onclick="send()">Send</button>
  </div>

  <script>
    const sessionId = Math.random().toString(36).slice(2);
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });

    function add(text, cls) {
      const d = document.createElement("div");
      d.className = "msg " + cls;
      d.textContent = text;
      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
      return d;
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      add(text, "user");
      const thinking = add("Thinking...", "bot");
      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message: text })
        });
        thinking.textContent = (await res.json()).reply;
      } catch (e) {
        thinking.textContent = "Network error. Try again.";
      }
    }
  </script>
</body>
</html>
